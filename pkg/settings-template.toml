# log settings for the application (RUST_LOG format)
# Env: MB__LOG
log = "INFO"

# Listen address for gRPC requests
# Env: MB__GRPC_LISTEN
grpc_listen = "0.0.0.0:6080"

# Base58-encoded hotspot public keys to deny
# Env: MB__DENIED_HOTSPOTS
# denied_hotspots = []

# Your LNS's dedup window (ChirpStack: deduplication_delay). Copies of a packet
# arriving later than this after the first are flagged as late on the dashboard.
# Env: MB__LNS_DEDUP_WINDOW
# lns_dedup_window = "200ms"

# Region names to deny (e.g., "US915", "EU868")
# Env: MB__DENIED_REGIONS
# denied_regions = []

# Where deny-list changes made through the admin API are persisted, so they
# survive a restart. The file records only how the live lists differ from
# denied_hotspots / denied_regions above, which stay the baseline.
# Set to "" to keep API changes in memory only.
# Env: MB__DENY_LIST_STORE
# deny_list_store = "deny-list.json"

# Where per-hotspot stats are saved (every minute and on shutdown) so they
# build up across restarts. Hotspots not seen for 30 days are dropped.
# Set to "" to keep them in memory only.
# Env: MB__HOTSPOT_STORE
# hotspot_store = "hotspots.json"

# Where names given to HPR addresses on the dashboard are saved.
# Set to "" to keep them in memory only.
# Env: MB__HPR_LABEL_STORE
# hpr_label_store = "hpr-labels.json"

# Prometheus metrics endpoint
[metrics]
# Env: MB__METRICS__ENDPOINT
endpoint = "0.0.0.0:19011"

# Admin API and metrics dashboard
[api]
# Env: MB__API__ENABLED
enabled = true
# Env: MB__API__LISTEN
listen = "0.0.0.0:6081"
# Shared secret required as `Authorization: Bearer <token>` on API requests.
# Unset means the API is unauthenticated, so bind `listen` somewhere only
# trusted operators can reach.
# Env: MB__API__AUTH_TOKEN
# auth_token = "change-me"

# Names for HPR addresses, shown on the dashboard instead of the IP. Names set
# on the dashboard override these; resetting one there falls back to these.
# Helium's HPRs currently run in AWS at:
[hpr_labels]
"3.69.232.10" = "Frankfurt"
"3.72.47.84" = "Frankfurt"
"18.236.140.3" = "Portland"
"44.245.6.101" = "Portland"
"13.214.211.194" = "Singapore"
